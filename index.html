<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本自由行排程工具 - 專業版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dragging { opacity: 0.5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex font-sans text-gray-800">

    <aside class="w-1/3 bg-white shadow-xl flex flex-col z-10 min-w-[350px]">
        <div class="p-5 border-b bg-gray-50 flex justify-between items-center">
            <h1 class="text-xl font-bold text-gray-800">探索地區</h1>
            <select id="region-select" class="p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500 font-bold bg-white" onchange="loadRegionData(this.value)">
                <option value="osaka">大阪 (Osaka)</option>
                <option value="kyoto">京都 (Kyoto)</option>
                <option value="kobe">神戶 (Kobe)</option>
            </select>
        </div>

        <div class="flex text-center border-b">
            <button id="tab-attractions" class="flex-1 py-3 font-bold text-blue-600 border-b-2 border-blue-600 transition-colors" onclick="switchTab('attractions')">玩樂景點</button>
            <button id="tab-food" class="flex-1 py-3 font-bold text-gray-500 hover:text-blue-500 transition-colors" onclick="switchTab('food')">在地美食 (Top 20)</button>
        </div>

        <div id="list-attractions" class="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-3"></div>
        <div id="list-food" class="flex-1 overflow-y-auto p-4 custom-scrollbar space-y-3 hidden"></div>

        <div class="p-5 border-t bg-gray-50 h-[35%] flex flex-col">
            <h2 class="font-bold mb-3 text-lg text-gray-800">🏨 推薦住宿與評價</h2>
            <div id="hotel-list" class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-2"></div>
        </div>
    </aside>

    <main class="w-2/3 p-8 overflow-y-auto custom-scrollbar bg-slate-50 relative" id="itinerary-main">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold text-slate-800">🗺️ 我的行程表</h2>
            <button onclick="addDay()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow transition-colors">
                + 新增一天
            </button>
        </div>
        
        <div id="days-container">
            </div>
    </main>

    <script>
        // ==========================================
        // 1. 資料庫 (包含大阪、京都、神戶)
        // ==========================================
        const regionData = {
            osaka: {

                    { name: '日本環球影城 (USJ)', tag: '主題樂園' }, { name: '海遊館', tag: '水族館' },

                    { name: '阿倍野 HARUKAS', tag: '高空觀景台' }, { name: '心齋橋筋商店街', tag: '血拼購物' },
                    { name: '難波八坂神社', tag: '巨型獅子頭' }, { name: 'teamLab Botanical Garden', tag: '光影藝術' }
                ],
                food: [

                    { name: '美津の 大阪燒', tag: '鐵板料理' }, { name: '老爺爺起司蛋糕', tag: '甜點' },
                    { name: '春駒壽司', tag: '平價壽司' }, { name: '鳥貴族 難波店', tag: '居酒屋' },
                    { name: '松阪牛燒肉 M', tag: '頂級燒肉' }, { name: '551 蓬萊肉包', tag: '中華小吃' },

                ],

                    { name: '康萊德酒店 (Conrad)', location: '中之島', rating: '4.7' },

                ]
            },
            kyoto: {
                attractions: [

                    { name: '金閣寺', tag: '歷史古蹟' }, { name: '嵐山竹林小徑', tag: '自然景觀' },
                    { name: '二條城', tag: '德川家康居所' }, { name: '八坂神社', tag: '祇園信仰' },
                    { name: '哲學之道', tag: '散步賞櫻' }, { name: '平等院', tag: '宇治名勝' },
                    { name: '京都塔', tag: '市區地標' }, { name: '渡月橋', tag: '嵐山名勝' }
                ],
                food: [
                    { name: '錦市場小吃', tag: '京都廚房' }, { name: '名代豬排 かつくら', tag: '炸豬排' },
                    { name: '祇園辻利', tag: '抹茶甜點' }, { name: 'Kichi Kichi 蛋包飯', tag: '網紅美食' },
                    { name: '本家尾張屋', tag: '蕎麥麵' }, { name: '南禪寺 順正', tag: '湯豆腐' },
                    { name: '豬一拉麵', tag: '米其林推薦' }, { name: 'Inoda Coffee', tag: '老字號早餐' },
                    { name: 'MACCHA HOUSE', tag: '抹茶提拉米蘇' }, { name: '弘燒肉', tag: '和牛燒肉' },
                    { name: '中村藤吉 宇治本店', tag: '頂級抹茶' }, { name: '豆雅傳', tag: '平價湯豆腐' },
                    { name: '山元麵藏', tag: '手打烏龍麵' }, { name: '麵屋極雞', tag: '超濃郁拉麵' },
                    { name: '柚子元', tag: '柚子鍋物' }, { name: '三嶋亭', tag: '百年壽喜燒' },
                    { name: '廣川 鰻魚飯', tag: '米其林一星' }, { name: '茶寮都路里', tag: '日式聖代' },
                    { name: '佰食屋', tag: '國產牛排丼' }, { name: '奧丹 清水', tag: '傳統湯豆腐' }
                ],
                hotels: [
                    { name: 'The Thousand Kyoto', location: '京都車站', rating: '4.7' },
                    { name: '京都格蘭比亞大酒店', location: '京都車站', rating: '4.5' },
                    { name: 'Good Nature Hotel', location: '河原町', rating: '4.6' },
                    { name: '京都十字飯店', location: '河原町', rating: '4.5' },
                    { name: '京都世紀飯店', location: '京都車站', rating: '4.3' },
                    { name: '三井花園飯店', location: '四條', rating: '4.4' }
                ]
            },
            kobe: {
                attractions: [
                    { name: '神戶港塔', tag: '神戶地標' }, { name: '美利堅公園', tag: '港口風光' },
                    { name: '北野異人館街', tag: '西洋建築' }, { name: '摩耶山 掬星台', tag: '千萬夜景' },
                    { name: '有馬溫泉', tag: '日本三大名湯' }, { name: '布引香草園', tag: '纜車與花海' },
                    { name: '生田神社', tag: '結緣神社' }, { name: '神戶動物王國', tag: '近距離接觸' },
                    { name: '南京町', tag: '中華街' }, { name: '明石海峽大橋', tag: '跨海大橋' }
                ],
                food: [
                    { name: 'Ishida 鐵板燒', tag: '神戶牛排' }, { name: 'Moriya (莫利亞)', tag: '神戶牛排' },
                    { name: '老祥記 豬肉包', tag: '南京町美食' }, { name: 'Cafe Freundlieb', tag: '教堂咖啡廳' },
                    { name: 'にしむら珈琲店', tag: '老派咖啡' }, { name: '神戶風月堂', tag: '法蘭酥甜點' },
                    { name: '明石燒 (玉子燒)', tag: '在地特色' }, { name: 'Steakland', tag: '平價神戶牛' },
                    { name: 'Peanuts Hotel Cafe', tag: '史努比主題' }, { name: '觀音屋', tag: '熱熔起司蛋糕' },
                    { name: 'Mouriya 凜', tag: '頂級牛排' }, { name: '燒肉 石田屋', tag: '神戶牛燒肉' },
                    { name: '元町蛋糕', tag: '在地老牌甜點' }, { name: '長田本庄軒', tag: '炒麵飯' },
                    { name: '神戶牛丼 廣重', tag: '超人氣牛丼' }, { name: '皇蘭 拉麵', tag: '豚骨醬油' },
                    { name: '鳴門鯛燒本舖', tag: '地瓜鯛魚燒' }, { name: 'TOOTH TOOTH', tag: '法式甜點' },
                    { name: '神戶牛 八坐和', tag: '神戶牛拉麵' }, { name: '伊藤格里爾', tag: '老字號洋食' }
                ],
                hotels: [
                    { name: '神戶美利堅公園東方酒店', location: '神戶港', rating: '4.3' },
                    { name: '神戶大倉酒店', location: '美利堅公園', rating: '4.4' },
                    { name: '全日空皇冠假日酒店', location: '新神戶', rating: '4.1' },
                    { name: '神戶波多比亞飯店', location: '人工島', rating: '4.2' },
                    { name: '雷姆 Plus 三宮', location: '三宮', rating: '4.5' },
                    { name: '布倫扎飯店 (Brenza)', location: '三宮', rating: '4.3' }
                ]
            }
        };

        // ==========================================
        // 2. 介面動態生成與切換
        // ==========================================
        let totalDays = 0;

        function createDayBlock(dayNum) {
            return `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 mb-6" id="day-${dayNum}">
                    <h3 class="text-xl font-bold mb-4 border-b pb-2 text-blue-600 flex justify-between">
                        <span>Day ${dayNum}</span>
                    </h3>
                    <div class="min-h-[120px] border-2 border-dashed border-gray-300 rounded-lg p-3 flex flex-col gap-2 transition-colors duration-200 bg-gray-50 drop-zone" 
                         ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event)">
                        <p class="text-gray-400 text-center mt-8 pointer-events-none font-medium tracking-wider empty-text">拖曳景點、美食或飯店到這裡</p>
                    </div>
                </div>
            `;
        }

        function addDay() {
            totalDays++;
            document.getElementById('days-container').insertAdjacentHTML('beforeend', createDayBlock(totalDays));
        }

        function generateStars(rating) {
            return `
                <div class="flex items-center bg-yellow-50 px-2 py-1 rounded">
                    <svg class="w-4 h-4 fill-yellow-500" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                    <span class="ml-1 font-bold text-yellow-700 text-sm">${rating}</span>
                </div>
            `;
        }

        function loadRegionData(regionKey) {
            const data = regionData[regionKey];
            const attractionsContainer = document.getElementById('list-attractions');
            const foodContainer = document.getElementById('list-food');
            const hotelContainer = document.getElementById('hotel-list');

            attractionsContainer.innerHTML = '';
            foodContainer.innerHTML = '';
            hotelContainer.innerHTML = '';

            data.attractions.forEach(item => {
                attractionsContainer.innerHTML += `
                    <div class="drag-item p-3 bg-blue-50 hover:bg-blue-100 rounded-lg shadow-sm border border-blue-200 cursor-move transition-colors flex justify-between items-center" draggable="true" ondragstart="dragStart(event)" data-name="${item.name}">
                        <div>
                            <h3 class="font-bold text-gray-800 item-title">${item.name}</h3>
                            <p class="text-xs text-blue-500 font-medium mt-1">📍 ${item.tag}</p>
                        </div>
                    </div>`;
            });

            data.food.forEach(item => {
                foodContainer.innerHTML += `
                    <div class="drag-item p-3 bg-orange-50 hover:bg-orange-100 rounded-lg shadow-sm border border-orange-200 cursor-move transition-colors flex justify-between items-center" draggable="true" ondragstart="dragStart(event)" data-name="${item.name}">
                        <div>
                            <h3 class="font-bold text-gray-800 item-title">${item.name}</h3>
                            <p class="text-xs text-orange-500 font-medium mt-1">🍽️ ${item.tag}</p>
                        </div>
                    </div>`;
            });

            data.hotels.forEach(hotel => {
                hotelContainer.innerHTML += `
                    <div class="drag-item bg-white p-3 rounded-lg shadow-sm border border-gray-200 hover:border-purple-300 cursor-move transition-colors flex justify-between items-center" draggable="true" ondragstart="dragStart(event)" data-name="${hotel.name}">
                        <div>
                            <h4 class="font-bold text-sm text-gray-800 item-title">${hotel.name}</h4>
                            <p class="text-xs text-purple-500 font-medium mt-1">🏨 ${hotel.location}</p>
                        </div>
                        ${generateStars(hotel.rating)}
                    </div>`;
            });
        }

        function switchTab(tabName) {
            document.getElementById('list-attractions').classList.add('hidden');
            document.getElementById('list-food').classList.add('hidden');
            const attrBtn = document.getElementById('tab-attractions');
            const foodBtn = document.getElementById('tab-food');
            attrBtn.className = "flex-1 py-3 font-bold text-gray-500 hover:text-blue-500 transition-colors";
            foodBtn.className = "flex-1 py-3 font-bold text-gray-500 hover:text-blue-500 transition-colors";
            document.getElementById(`list-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).className = "flex-1 py-3 font-bold text-blue-600 border-b-2 border-blue-600 transition-colors";
        }

        // ==========================================
        // 3. 拖曳與 Google Maps 連動邏輯
        // ==========================================
        let draggedItemHTML = null;

        function dragStart(event) {
            // 確保拖拉的是整個卡片
            const target = event.target.closest('.drag-item');
            if(!target) return;
            
            target.classList.add('opacity-50');
            draggedItemHTML = target.outerHTML;
            setTimeout(() => target.classList.remove('opacity-50'), 0); 
        }

        function dragOver(event) {
            event.preventDefault();
            const dropzone = event.target.closest('.drop-zone');
            if(dropzone) dropzone.classList.add('bg-blue-50', 'border-blue-400');
        }

        function dragLeave(event) {
            const dropzone = event.target.closest('.drop-zone');
            if(dropzone) dropzone.classList.remove('bg-blue-50', 'border-blue-400');
        }

        function drop(event) {
            event.preventDefault();
            const dropzone = event.target.closest('.drop-zone');
            if(!dropzone) return;
            dropzone.classList.remove('bg-blue-50', 'border-blue-400');
            
            const placeholder = dropzone.querySelector('.empty-text');
            if (placeholder) placeholder.style.display = 'none';

            const newElement = document.createElement('div');
            newElement.innerHTML = draggedItemHTML;
            const finalElement = newElement.firstElementChild;
            
            // 移除原本側邊欄的懸停顏色，加上純白底色
            finalElement.classList.remove('opacity-50', 'hover:bg-blue-100', 'hover:bg-orange-100', 'hover:border-purple-300');
            finalElement.classList.add('bg-white', 'w-full');
            
            // 尋找排在它前面的上一個景點，用來規劃路線
            const existingItems = dropzone.querySelectorAll('.drag-item');
            let prevItemName = null;
            if (existingItems.length > 0) {
                prevItemName = existingItems[existingItems.length - 1].getAttribute('data-name');
            }

            // 新增刪除按鈕
            const deleteBtn = document.createElement('button');
            deleteBtn.innerHTML = '❌';
            deleteBtn.className = 'ml-4 text-gray-300 hover:text-red-500 transition-colors';
            
            // 建立裝載交通路線按鈕的容器
            let transitDiv = null;

            deleteBtn.onclick = function() {
                if(transitDiv) transitDiv.remove();
                finalElement.remove();
                // 如果刪除後沒有項目了，把提示字加回來
                if (dropzone.querySelectorAll('.drag-item').length === 0) {
                    placeholder.style.display = 'block';
                }
            };
            
            finalElement.appendChild(deleteBtn);
            dropzone.appendChild(finalElement);

            // 產生 Google Maps 大眾運輸路線按鈕
            if (prevItemName) {
                const currItemName = finalElement.getAttribute('data-name');
                transitDiv = document.createElement('div');
                transitDiv.className = 'flex justify-center my-1';
                
                // 正確的 Google Maps 路線規劃網址格式 (travelmode=transit 代表大眾運輸)
                const mapUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(prevItemName)}&destination=${encodeURIComponent(currItemName)}&travelmode=transit`;
                
                transitDiv.innerHTML = `<a href="${mapUrl}" target="_blank" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-1.5 rounded-full transition-colors flex items-center shadow-sm">🚆 點擊查看 Google Maps 交通時間</a>`;
                dropzone.insertBefore(transitDiv, finalElement);
            }
        }

        // ==========================================
        // 4. 強制直接初始化 (避免 onload 失效)
        // ==========================================
        addDay(); addDay(); addDay(); // 建立 Day 1 ~ Day 3
        loadRegionData('osaka');      // 載入大阪資料
    </script>
</body>
</html>
